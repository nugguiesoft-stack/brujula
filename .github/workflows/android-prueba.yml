# Prueba MANUAL de humo de la app en un emulador de Android: la instala, la abre, comprueba que no se cierra y guarda una captura.
# Se lanza a mano: Actions → «App Android · prueba en emulador» → Run workflow.
name: App Android · prueba en emulador
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Compilar
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash android/prueba-emulador.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: capturas-emulador, path: capturas/ }
